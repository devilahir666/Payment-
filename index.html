<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">
    <h2>Membership Payment</h2>
    <p>Bhai, ₹2 pay karne ke liye niche button dabayein:</p>
    
    <button id="payBtn" style="padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 10px;">
        Pay ₹2 via UPI
    </button>

    <script>
        // URL se ?ref=... wali value nikalna
        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref') || "MBR_TEST"; // Agar ID nahi mili toh MBR_TEST

        document.getElementById('payBtn').onclick = function() {
            // UPI Intent link (ye Android apps ke liye best hai)
            const url = "upi://pay?pa=abharat298-2@oksbi&pn=Bharat&am=2&cu=INR&tn=" + refId;
            
            // Direct redirect try karo
            window.location.href = url;
        };
    </script>
</body>
</html>
